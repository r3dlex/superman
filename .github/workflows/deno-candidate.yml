# The Gate 1 candidate CI workflow — the published copy.
#
# This file is the published copy of the Deno candidate's reviewed template.
# The template itself stays outside `.github/workflows/`, so GitHub Actions
# never discovers it. Publication was separately authorized on 2026-11-07.
#
# It adds the candidate proof legs. It does not touch the Node required
# evaluation: the required check producers stay `bootstrap (macos-15)`,
# `bootstrap (ubuntu-24.04)` and `bootstrap (ubuntu-24.04-arm)`, and no
# candidate leg is ever a required check.
#
# What it declares, and where each fact comes from:
#   - The three native platforms, their runner label sets and the candidate
#     identities are the recorded ones. The required check producers and their
#     routing are in `.superman/ci/bootstrap.json` and in the row 12 operator
#     request; the `v2.9.8` archive and executable digests are the recorded
#     release identities in `.scratch/superman-v0/deno-artifact-candidate.md`.
#     The arm64 leg runs in the `r3dlex-linux-arm64` group, not in
#     `r3dlex-org`, and a platform that cannot run blocks: the matrix is
#     closed, `fail-fast` is off, and no leg is skipped or reported as `n/a`.
#   - The Node required evaluation is not touched by this file. The required
#     check producers stay `bootstrap (macos-15)`, `bootstrap (ubuntu-24.04)`
#     and `bootstrap (ubuntu-24.04-arm)` under app id 15368. The candidate
#     proof below is additional: it is never a required check, it is never
#     promoted to one, and it never substitutes for the Node admission result.
#   - The candidate route runs under the reviewed permission profile of the
#     operational Deno root: the launch flags and the permission classes come
#     from that root's exec seam, so the candidate proof is granted exactly
#     what the Deno surface itself is granted. There is no blanket grant, no
#     prompt escalation and no ambient configuration discovery.
#   - The candidate route selects nothing by environment variable, file
#     presence or tool availability, and it never falls back to the Node
#     evaluation surface. A missing or mismatched candidate fails the job.
#   - The Deno subjects are reached as modules of the operational Deno root,
#     which is the Deno counterpart of the Node route's `node .superman/ci/*`
#     entry points. The row 9 rule's banned command family is therefore not
#     used here at all, so this workflow stays clean when it is published and
#     the rule is live.
#
# The archive URL is derived from the recorded release tag (`v2.9.8` of
# `denoland/deno`) and the recorded asset names; the recorded digests are the
# authority, and a mismatch fails the job.
#
# Operator prerequisites this template assumes and does not provide: the
# runner images carry `unzip` and `tar`, and the self-hosted groups carry the
# reviewed runner labels.
name: superman-deno-candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deno-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARCHGATE_TELEMETRY: "0"
  HEAD_REF: ${{ github.head_ref }}
  BASE_REF: ${{ github.base_ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: echo probe
