# The Gate 1 candidate CI workflow — the published copy.
#
# This file is the published copy of the Deno candidate's reviewed template.
# The template itself stays outside `.github/workflows/`, so GitHub Actions
# never discovers it. Publication was separately authorized on 2026-11-07.
#
# It adds the candidate proof legs. It does not touch the Node required
# evaluation: the required check producers stay `bootstrap (macos-15)`,
# `bootstrap (ubuntu-24.04)` and `bootstrap (ubuntu-24.04-arm)`, and no
# candidate leg is ever a required check.
#
# What it declares, and where each fact comes from:
#   - The three native platforms, their runner label sets and the candidate
#     identities are the recorded ones. The required check producers and their
#     routing are in `.superman/ci/bootstrap.json` and in the row 12 operator
#     request; the `v2.9.8` archive and executable digests are the recorded
#     release identities in `.scratch/superman-v0/deno-artifact-candidate.md`.
#     The arm64 leg runs in the `r3dlex-linux-arm64` group, not in
#     `r3dlex-org`, and a platform that cannot run blocks: the matrix is
#     closed, `fail-fast` is off, and no leg is skipped or reported as `n/a`.
#   - The Node required evaluation is not touched by this file. The required
#     check producers stay `bootstrap (macos-15)`, `bootstrap (ubuntu-24.04)`
#     and `bootstrap (ubuntu-24.04-arm)` under app id 15368. The candidate
#     proof below is additional: it is never a required check, it is never
#     promoted to one, and it never substitutes for the Node admission result.
#   - The candidate route runs under the reviewed permission profile of the
#     operational Deno root: the launch flags and the permission classes come
#     from that root's exec seam, so the candidate proof is granted exactly
#     what the Deno surface itself is granted. There is no blanket grant, no
#     prompt escalation and no ambient configuration discovery.
#   - The candidate route selects nothing by environment variable, file
#     presence or tool availability, and it never falls back to the Node
#     evaluation surface. A missing or mismatched candidate fails the job.
#   - The Deno subjects are reached as modules of the operational Deno root,
#     which is the Deno counterpart of the Node route's `node .superman/ci/*`
#     entry points. The row 9 rule's banned command family is therefore not
#     used here at all, so this workflow stays clean when it is published and
#     the rule is live.
#
# The archive URL is derived from the recorded release tag (`v2.9.8` of
# `denoland/deno`) and the recorded asset names; the recorded digests are the
# authority, and a mismatch fails the job.
#
# Operator prerequisites this template assumes and does not provide: the
# runner images carry `unzip` and `tar`, and the self-hosted groups carry the
# reviewed runner labels.
name: superman-deno-candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deno-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARCHGATE_TELEMETRY: "0"
  HEAD_REF: ${{ github.head_ref }}
  BASE_REF: ${{ github.base_ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  deno-candidate:
    name: deno-candidate (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            runner: '["self-hosted","macOS","ARM64","r3dlex-org"]'
            deno_archive: deno-aarch64-apple-darwin.zip
            deno_archive_sha256: 9f0bf660393da2eaff044cdc7444cb08c73f235849b61d224d825a194ce7c98e
            deno_sha256: d1e99265e5e6ee096c5780d88ff7d3e6cfdf33b1953a118b4889cab8ca6980ba
            denort_archive: denort-aarch64-apple-darwin.zip
            denort_archive_sha256: 0d44d476ffcb0406771ed62eca9da8a9bc12b2f0b4a2c7b477b5303809c5b483
            denort_sha256: f0003b0441a483f4a88ef18342549ee38ff76d829b48c9f51b43df911e780cfb
            deno_version: 2.9.8
          - os: ubuntu-24.04
            platform: linux-x64
            runner: '["self-hosted","Linux","X64","r3dlex-org"]'
            deno_archive: deno-x86_64-unknown-linux-gnu.zip
            deno_archive_sha256: e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
            deno_sha256: 368bca08999e02c6911b8f248167b582276b1f547db5712b6e736d7eda1dbda7
            denort_archive: denort-x86_64-unknown-linux-gnu.zip
            denort_archive_sha256: 1577df68c9fe13ec7b974d10d483e9f8974575a3d17f7c127489cf5032e14bd4
            denort_sha256: 7b91d3d117804c0ebe05ac017a3430e0f09d9ab05b588ff0bda6f514dd0a4f2d
            deno_version: 2.9.8
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            runner: '["self-hosted","Linux","ARM64","r3dlex-linux-arm64"]'
            deno_archive: deno-aarch64-unknown-linux-gnu.zip
            deno_archive_sha256: d49596c20b9788cf8f5d8ddf644103d4bde56ed239753f0bdb92ba9361d51905
            deno_sha256: b484f780e5149ca05c673f1f79f7fb466f12a2295933bdad917af4a8a5c020e8
            denort_archive: denort-aarch64-unknown-linux-gnu.zip
            denort_archive_sha256: 1cf6a3b3e8c1f364c2b89fd08605e5c2d16ed1c670fed330fb5e370c2dbf6b3d
            denort_sha256: bab7bc2f98ff656f335712f064b97bdedfa243d4a59ada40bd30b48e268db01b
            deno_version: 2.9.8
    env:
      DENO_ARCHIVE_URL: https://github.com/denoland/deno/releases/download/v2.9.8/${{ matrix.deno_archive }}
      DENO_ARCHIVE_SHA256: ${{ matrix.deno_archive_sha256 }}
      DENO_BINARY_SHA256: ${{ matrix.deno_sha256 }}
      DENORT_ARCHIVE_URL: https://github.com/denoland/deno/releases/download/v2.9.8/${{ matrix.denort_archive }}
      DENORT_ARCHIVE_SHA256: ${{ matrix.denort_archive_sha256 }}
      DENORT_BINARY_SHA256: ${{ matrix.denort_sha256 }}
      DENO_VERSION: ${{ matrix.deno_version }}
      CANDIDATE_RECEIPT_DIR: .superman-ci/deno-bootstrap/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The candidate's own install directory. The hosted workflow and the
          # candidate run on the same runners at the same time, and two
          # installs into one directory collide: one of them finds it
          # half-installed and fails.
          dest: ~/setup-pnpm-candidate
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Install the pinned Deno candidate and verify its recorded identity
        env:
          # The runner context is a step context: a job-level environment
          # cannot name `runner`, and a workflow that does is rejected whole.
          DENO_DIR: ${{ runner.temp }}/superman-deno
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const candidates = [
            { url: process.env.DENO_ARCHIVE_URL, archive: process.env.DENO_ARCHIVE_SHA256, binary: process.env.DENO_BINARY_SHA256, name: 'deno' },
            { url: process.env.DENORT_ARCHIVE_URL, archive: process.env.DENORT_ARCHIVE_SHA256, binary: process.env.DENORT_BINARY_SHA256, name: 'denort' },
          ];
          mkdirSync(process.env.DENO_DIR, { recursive: true });
          for (const candidate of candidates) {
            const response = await fetch(candidate.url);
            if (!response.ok) throw new Error(`${candidate.name} candidate download failed: ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== candidate.archive) throw new Error(`${candidate.name} candidate archive checksum mismatch: ${digest}`);
            writeFileSync(join(process.env.DENO_DIR, `${candidate.name}.zip`), bytes);
          }
          NODE
          # The archives are read with the repository's own reader, so the
          # candidate legs do not depend on the runner having an unzip: the
          # self-hosted arm64 runner has none.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { zipContent, zipEntry } = await import(
            new URL('.superman/ci/extract-zip.ts', `file://${process.cwd()}/`).href
          );
          for (const name of ['deno', 'denort']) {
            const bytes = readFileSync(join(process.env.DENO_DIR, `${name}.zip`));
            const entry = zipEntry(bytes, name);
            if (!entry) throw new Error(`${name} is not in the downloaded archive`);
            // These are executables, and the archive's own mode is not
            // guaranteed to record that, so the executable bit is set here.
            writeFileSync(join(process.env.DENO_DIR, name), zipContent(bytes, entry), { mode: 0o755 });
          }
          NODE
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const candidates = [
            { binary: 'deno', expected: process.env.DENO_BINARY_SHA256 },
            { binary: 'denort', expected: process.env.DENORT_BINARY_SHA256 },
          ];
          for (const candidate of candidates) {
            const digest = createHash('sha256').update(readFileSync(join(process.env.DENO_DIR, candidate.binary))).digest('hex');
            if (digest !== candidate.expected) throw new Error(`${candidate.binary} candidate executable checksum mismatch: ${digest}`);
            console.log(`pinned ${candidate.binary} candidate verified: ${digest}`);
          }
          NODE
          test "$("$DENO_DIR/deno" --version | sed -n 's/^deno \([0-9.]*\).*/\1/p')" = "$DENO_VERSION"
          printf 'SUPERMAN_DENO_BIN=%s\n' "$DENO_DIR/deno" >> "$GITHUB_ENV"
          printf 'SUPERMAN_DENORT_BIN=%s\n' "$DENO_DIR/denort" >> "$GITHUB_ENV"
          printf '%s\n' "$DENO_DIR" >> "$GITHUB_PATH"
      - name: Verify platform and install the checksum-locked external tools
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const platform = `${process.platform}-${process.arch}`;
          if (platform !== process.env.EXPECTED_PLATFORM) throw new Error(`Wrong runner platform: ${platform}`);
          const assets = JSON.parse(readFileSync('.superman/ci/tool-assets.json', 'utf8'));
          const tools = ['archgate', ...(platform === 'linux-x64' ? ['trivy'] : [])];
          const plan = [];
          for (const tool of tools) {
            const asset = assets[tool]?.[platform];
            if (!asset) throw new Error(`reviewed ${tool} ${platform} asset is missing`);
            if (!/^[a-f0-9]{64}$/.test(asset.sha256) || !asset.url.startsWith('https://github.com/')) throw new Error(`Invalid tool asset identity: ${tool}`);
            const response = await fetch(asset.url);
            if (!response.ok) throw new Error(`asset download failed: ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (createHash('sha256').update(bytes).digest('hex') !== asset.sha256) throw new Error(`${tool} checksum mismatch`);
            const directory = join(process.env.RUNNER_TEMP, `superman-${tool}`);
            mkdirSync(directory, { recursive: true });
            const archive = join(directory, 'asset.tar.gz');
            writeFileSync(archive, bytes);
            plan.push([tool, `${tool.toUpperCase()}_BIN`, archive, directory].join('\t'));
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'superman-tool-plan.tsv'), `${plan.join('\n')}\n`);
          NODE
          while IFS="$(printf '\t')" read -r tool variable archive directory; do
            tar -xzf "$archive" -C "$directory"
            "$directory/$tool" --version
            printf '%s=%s\n' "$variable" "$directory/$tool" >> "$GITHUB_ENV"
            printf '%s\n' "$directory" >> "$GITHUB_PATH"
          done < "$RUNNER_TEMP/superman-tool-plan.tsv"
      - name: Candidate proof under the reviewed Deno permission profile
        env:
          DENO_BIN: ${{ runner.temp }}/superman-deno/deno
          COVERAGE_MODE: incremental
        run: |
          set -euo pipefail
          "$DENO_BIN" run --no-prompt --no-config --no-lock --no-npm --no-remote --allow-read --allow-write --allow-env --allow-run .superman/deno-bootstrap/pr-policy.ts
          # The Deno surface's own floor is unmet, so the collector exits 1
          # truthfully and the receipt carries the obligation. The binding is
          # by receipt, not by exit status; any other exit is a real failure.
          set +e
          "$DENO_BIN" run --no-prompt --no-config --no-lock --no-npm --no-remote --allow-read --allow-write --allow-env --allow-run .superman/deno-bootstrap/coverage.ts --mode "$COVERAGE_MODE"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
          mkdir -p "$CANDIDATE_RECEIPT_DIR"
          "$DENO_BIN" run --no-prompt --no-config --no-lock --no-npm --no-remote --allow-read --allow-write --allow-env --allow-run .superman/deno-bootstrap/raw-gates.ts --stage ci --receipt "$CANDIDATE_RECEIPT_DIR/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deno-candidate-${{ matrix.platform }}
          path: |
            .superman-ci/deno-bootstrap/
            .superman-ci/coverage-deno-*/
            !.superman-ci/**/v8/
          include-hidden-files: true
          if-no-files-found: warn
