name: archgate-linux-arm64-candidate

on:
  workflow_dispatch:
  push:
    branches: [spec/superman-v0]
    paths: [".github/workflows/archgate-linux-arm64-candidate.yml"]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: [self-hosted, Linux, ARM64, r3dlex-linux-arm64]
    timeout-minutes: 90
    steps:
      - name: Build unapproved Archgate 0.61.0 candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          curl -fsSL -o bun-linux-aarch64.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-aarch64.zip
          curl -fsSL -o SHASUMS256.txt https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/SHASUMS256.txt
          grep ' bun-linux-aarch64.zip$' SHASUMS256.txt | sha256sum -c
          curl -fsSL -o node.tar.gz https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-arm64.tar.gz
          curl -fsSL -o node-SHASUMS256.txt https://nodejs.org/dist/v26.13.0/SHASUMS256.txt
          grep ' node-v26.13.0-linux-arm64.tar.gz$' node-SHASUMS256.txt | sha256sum -c
          tar -xzf node.tar.gz
          ./node-v26.13.0-linux-arm64/bin/node --input-type=module <<'JS'
          import { inflateRawSync } from "node:zlib";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { dirname } from "node:path";
          const data = readFileSync("bun-linux-aarch64.zip");
          let eocd = -1;
          for (let i = data.length - 22; i >= Math.max(0, data.length - 65557); i--) {
            if (data.readUInt32LE(i) === 0x06054b50) { eocd = i; break; }
          }
          if (eocd < 0) throw new Error("Bun zip has no end-of-central-directory");
          const count = data.readUInt16LE(eocd + 10);
          let offset = data.readUInt32LE(eocd + 16);
          for (let n = 0; n < count; n++) {
            if (data.readUInt32LE(offset) !== 0x02014b50) throw new Error("Bun zip central directory is invalid");
            const method = data.readUInt16LE(offset + 10);
            const compSize = data.readUInt32LE(offset + 20);
            const nameLen = data.readUInt16LE(offset + 28);
            const extraLen = data.readUInt16LE(offset + 30);
            const commentLen = data.readUInt16LE(offset + 32);
            const localOff = data.readUInt32LE(offset + 42);
            const name = data.subarray(offset + 46, offset + 46 + nameLen).toString();
            const start = localOff + 30 + data.readUInt16LE(localOff + 26) + data.readUInt16LE(localOff + 28);
            const compressed = data.subarray(start, start + compSize);
            const bytes = method === 0 ? compressed : inflateRawSync(compressed);
            if (name.endsWith("/")) mkdirSync(name, { recursive: true });
            else { mkdirSync(dirname(name), { recursive: true }); writeFileSync(name, bytes); }
            offset += 46 + nameLen + extraLen + commentLen;
          }
          JS
          install -m 755 bun-linux-aarch64/bun "$RUNNER_TEMP/bun"
          git clone --depth 1 --branch v0.61.0 https://github.com/archgate/cli.git archgate-src
          git -C archgate-src fetch --depth 1 origin f65d99f56d02757cca94d53f6d717333770e0170
          git -C archgate-src checkout --detach f65d99f56d02757cca94d53f6d717333770e0170
          test "$(git -C archgate-src rev-parse HEAD)" = f65d99f56d02757cca94d53f6d717333770e0170
          cd archgate-src
          "$RUNNER_TEMP/bun" install --frozen-lockfile --ignore-scripts
          "$RUNNER_TEMP/bun" run test
          "$RUNNER_TEMP/bun" build src/cli.ts --compile --bytecode \
            --compile-exec-argv=--use-system-ca --minify \
            --target=bun-linux-arm64 --outfile "$RUNNER_TEMP/archgate"
          test "$("$RUNNER_TEMP/archgate" --version)" = 0.61.0
          mkdir -p "$RUNNER_TEMP/release"
          install -m 755 "$RUNNER_TEMP/archgate" "$RUNNER_TEMP/release/archgate"
          cp LICENSE.md "$RUNNER_TEMP/release/LICENSE.md"
          tar -czf "$RUNNER_TEMP/archgate-linux-arm64.tar.gz" -C "$RUNNER_TEMP/release" archgate LICENSE.md
          sha256sum "$RUNNER_TEMP/archgate" "$RUNNER_TEMP/archgate-linux-arm64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archgate-linux-arm64-candidate
          path: ${{ runner.temp }}/archgate-linux-arm64.tar.gz
          if-no-files-found: error
