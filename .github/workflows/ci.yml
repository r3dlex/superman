# M1 minimal CI. Ticket 01 (M2) adds the 3-OS raw gates and ticket 06 (M7)
# switches to `superman gate ci`, each through a spec-kind follow-up PR.
# No pull_request_target anywhere; no secrets; read-only token.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ARCHGATE_TELEMETRY: "0"

jobs:
  archgate:
    name: G1 archgate --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: archgate check (changed files vs base)
        run: pnpm exec archgate check --base "origin/${BASE_REF}" --strict --output github
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: archgate check (full repo)
        run: pnpm exec archgate check --strict --output github

  pr-policy:
    name: G4 path policy + G8 traceability (G9 placeholder)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: path policy
        run: node .superman/ci/pr-policy.ts
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
